name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual build'
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf

      # Cache cargo registry, index, and build directories
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
          key: cargo-${{ hashFiles('**/Cargo.toml') }}

      # Library-only builds: tests enable nalgebra's std via the dev-dependency,
      # so only these catch feature code that needs nalgebra float features
      - name: Build
        run: cargo build --all-features --verbose

      - name: Build no_std
        run: cargo build --lib --all-features --target thumbv7em-none-eabihf

      - name: setup
        run: |
            sudo apt update
            sudo apt install libfontconfig1-dev pkg-config

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Features only add conversions, so --all-features also covers the default build
      - name: Test
        run: cargo nextest run --profile ci --all-features

      # nextest does not run doctests
      - name: Doctests
        run: cargo test --doc --all-features

      - name: Create Github test summary
        uses: test-summary/action@dist
        with:
          paths: target/nextest/ci/test-results/*.xml
        if: always()
