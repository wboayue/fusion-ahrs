[workspace]
members = ["fusion-c-sys"]

[package]
name = "fusion-ahrs"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
authors = ["Wil Boayue <wil@wsbsolutions.com>"]
description = "Rust port of xioTechnologies' Fusion AHRS C library — sensor fusion for gyroscope, accelerometer, and magnetometer with no_std support."
readme = "README.md"
homepage = "https://github.com/wboayue/fusion-ahrs/"
repository = "https://github.com/wboayue/fusion-ahrs/"
documentation = "https://docs.rs/fusion-ahrs/latest/fusion-ahrs/"
license = "MIT OR Apache-2.0"
keywords = ["ahrs", "imu", "sensor-fusion", "quaternion", "embedded"]
categories = ["embedded", "algorithms", "science"]
exclude = [
    "justfile",
    "CLAUDE.md",
    "fusion-c",
    "fusion-c-sys",
    ".github",
    ".config",
    ".gitmodules",
    "testdata",
    "*.png",
    "tarpaulin-report.html",
]

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }

[dev-dependencies]
csv = "1.4"
plotters = "0.3"
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"
rand_pcg = "0.10"
# Test-only C reference bindings; path-only, stripped on publish
fusion-c-sys = { path = "fusion-c-sys" }

[[bench]]
name = "ahrs_benchmarks"
harness = false
