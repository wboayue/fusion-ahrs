[workspace]
members = ["fusion-c-sys"]

[package]
name = "fusion-ahrs"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Wil Boayue <wil@wsblabs.com>"]
description = "Rust port of xioTechnologies' Fusion AHRS C library — sensor fusion for gyroscope, accelerometer, and magnetometer with no_std support."
readme = "README.md"
homepage = "https://github.com/wboayue/fusion-ahrs/"
repository = "https://github.com/wboayue/fusion-ahrs/"
documentation = "https://docs.rs/fusion-ahrs/latest/fusion_ahrs/"
license = "MIT"
keywords = ["ahrs", "imu", "sensor-fusion", "madgwick", "orientation"]
categories = ["embedded", "no-std::no-alloc", "algorithms", "science::robotics", "aerospace"]
exclude = [
    "justfile",
    "AGENTS.md",
    "fusion-c",
    "fusion-c-sys",
    ".github",
    ".config",
    ".gitmodules",
    "testdata",
    # Need the unpublished fusion-c-sys and the fusion-c submodule
    "tests/c_comparison_test.rs",
    "tests/c_math_test.rs",
    "*.png",
    "tarpaulin-report.html",
]

[dependencies]
libm = "0.2"
# Optional conversions, one feature per supported nalgebra version
nalgebra_0_35 = { package = "nalgebra", version = "0.35", optional = true, default-features = false }

[features]
# Conversions between the crate math types and nalgebra 0.35 types
nalgebra-0_35 = ["dep:nalgebra_0_35"]

[dev-dependencies]
csv = "1.4"
plotters = "0.3"
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"
rand_pcg = "0.10"
# For nalgebra interop tests and doctests; same key as the optional dependency
nalgebra_0_35 = { package = "nalgebra", version = "0.35" }
# Test-only C reference bindings; path-only, stripped on publish
fusion-c-sys = { path = "fusion-c-sys" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "ahrs_benchmarks"
harness = false
